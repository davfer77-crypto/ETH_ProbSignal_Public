name: ETH Prob Signal V2.4 (cada 5m)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-eth-prob-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements_eth_prob.txt

      - name: Run ETH ProbSignal V2.4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ETH_PROB_V2_SIGNAL.py
